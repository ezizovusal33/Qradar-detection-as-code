name: QRadar Detection-as-Code Sync

on:
  push:
    branches:
      - main
    paths:
      - 'qradar/rules/**'
      - 'scripts/**'
  workflow_dispatch:

jobs:
  sync-to-qradar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests urllib3

      - name: Run QRadar Sync Pipeline
        env:
          QRADAR_IP: ${{ secrets.QRADAR_IP }}
          QRADAR_TOKEN: ${{ secrets.QRADAR_TOKEN }}
        run: python scripts/qradar_sync_pipeline.py
